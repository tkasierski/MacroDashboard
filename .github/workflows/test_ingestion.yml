name: Test ingestion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run FRED ingestion
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.macro_dashboard.pipeline
